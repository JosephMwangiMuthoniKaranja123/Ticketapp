<!DOCTYPE html>
<html>
    <head>
        <h2>Event details</h2>
    </head>
    <body>
      

        <h2>{{event.name}}</h2>
          <p>{{event.description}}</p>
          <P>{{event.location}}</P>
          <p>{{event.date}}</p>
          <p>{{event.starttime}}</p>

         <h3>Tickets</h3>

          
          
          <form method="post" action="{% url 'add_to_cart'  %}">
          {% csrf_token %}
       
           {% for tickettype in event.ticket_types.all %}
          <label>
            <input
            type="radio"
            name="tickettype"
            value={{tickettype.id}}
            {% if forloop.first %}checked{% endif %}
            required>
            <strong>{{tickettype.name}}</strong> -KSH {{tickettype.price}}  ({{tickettype.quantity}} available) </label>
          <br><br>
           
        <label for="quantity">quantity</label>
            <input
            type="number"
            id="quantity"
            name="quantity"
            value="1"
            min="1"
            max="10"
            required

            >
       
        
     
     {% empty %}
          <p>No tickets available</p>
     {% endfor %}
       <button type="submit">Add to cart</button> 
     </form>
    
           

    </body>
</html>
